version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: flexhotel
      POSTGRES_PASSWORD: flexhotel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:flexhotel@postgres:5432/flexhotel
      JWT_SECRET: seu_secret_jwt_aqui
      NODE_ENV: development
    depends_on:
      - postgres
    volumes:
      - .:/app

volumes:
  postgres_data:
